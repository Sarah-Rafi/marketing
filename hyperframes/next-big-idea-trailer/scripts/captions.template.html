<template>
  <style>
    #root {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    .cap {
      position: absolute;
      left: 0;
      width: 100%;
      bottom: 124px;
      text-align: center;
      overflow: visible;
      opacity: 0;
    }
    .cap span {
      display: inline-block;
      padding: 8px 22px 10px;
      border-radius: 4px;
      background: rgba(12, 10, 9, 0.74);
      font-family: "Inter", sans-serif;
      font-weight: 600;
      font-size: 50px;
      line-height: 1.15;
      color: #f3eee4;
      letter-spacing: -0.005em;
    }
  </style>
  <div id="root" data-composition-id="captions" data-width="1920" data-height="1080">
    <!-- Verbatim narration. Lines written on screen as they are spoken (idea cards, the path,
         the title, the end card) are not repeated here. Generated by scripts/layout.py. -->
{{DIVS}}
  </div>
  <script>
    const tl = gsap.timeline({ paused: true });
    // [start, end] in seconds, from Kokoro audio placement + transcribed word timings (assets/voice/*.words.json).
    const groups = [
      {{GROUPS}},
    ];
    groups.forEach(([s, e], i) => {
      const id = "#cap-" + (i + 1);
      tl.fromTo(id, { opacity: 0 }, { opacity: 1, duration: 0.1, ease: "power1.out" }, s);
      tl.to(id, { opacity: 0, duration: 0.1, ease: "power2.in" }, e - 0.1);
      tl.set(id, { opacity: 0, visibility: "hidden" }, e);
    });
    window.__timelines["captions"] = tl;
  </script>
</template>
