<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root {
        --ground: #0e0d0c;
        --ink: #eae2cf;
        --red: #c8372d;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--ground);
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        background: var(--ground);
      }
      #fx-vignette {
        position: absolute;
        inset: 0;
        z-index: 40;
        pointer-events: none;
        background: radial-gradient(ellipse 75% 70% at 50% 48%, transparent 55%, rgba(0, 0, 0, 0.55) 100%);
      }
      #fx-grain {
        position: absolute;
        inset: -200px;
        z-index: 41;
        pointer-events: none;
        opacity: 0.07;
        mix-blend-mode: overlay;
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' seed='7' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='300' height='300' filter='url(%23n)'/></svg>");
        background-size: 300px 300px;
      }
      .fx-bar {
        position: absolute;
        left: 0;
        width: 100%;
        height: 54px;
        background: #000;
        z-index: 60;
      }
      #fx-bar-top {
        top: 0;
      }
      #fx-bar-bottom {
        bottom: 0;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="{{TOTAL}}"
      data-width="1920"
      data-height="1080"
    >
{{HOSTS}}

      <div id="captions" data-composition-id="captions" data-composition-src="compositions/captions.html" data-start="0" data-duration="{{TOTAL}}" data-track-index="2" data-track-kind="captions" data-width="1920" data-height="1080" style="z-index: 50"></div>

      <div id="fx-vignette" class="clip" data-start="0" data-duration="{{TOTAL}}" data-track-index="3"></div>
      <div id="fx-grain" class="clip" data-start="0" data-duration="{{TOTAL}}" data-track-index="3"></div>
      <div id="fx-bar-top" class="fx-bar clip" data-start="0" data-duration="{{TOTAL}}" data-track-index="3"></div>
      <div id="fx-bar-bottom" class="fx-bar clip" data-start="0" data-duration="{{TOTAL}}" data-track-index="3"></div>

      <!-- Narration: Kokoro-82M, voice am_michael, speed 0.95 (npx hyperframes tts); text in scripts/narration.tsv -->
{{AUDIOS}}
      <!-- Original score + effects, synthesised by scripts/score.py. This file is generated by scripts/layout.py from scripts/index.template.html. -->
      <audio id="music" src="assets/music/score.wav" data-start="0" data-duration="{{TOTAL}}" data-volume="0.988553" data-track-index="11"></audio>
      <audio id="sfx" src="assets/sfx/sfx.wav" data-start="0" data-duration="{{TOTAL}}" data-volume="0.7" data-track-index="12"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      // Film grain: jump the noise tile 12 times a second (stepped, deterministic).
      const grainSteps = {{GRAIN_STEPS}};
      tl.fromTo(
        "#fx-grain",
        { x: 0, y: 0 },
        {
          keyframes: Array.from({ length: grainSteps }, (_, i) => ({
            x: ((i * 137) % 200) - 100,
            y: ((i * 89) % 200) - 100,
            duration: {{TOTAL}} / grainSteps,
            ease: "steps(1)",
          })),
        },
        0,
      );
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
