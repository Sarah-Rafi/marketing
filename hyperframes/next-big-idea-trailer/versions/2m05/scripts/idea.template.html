  <div id="root" data-composition-id="{{ID}}" data-width="1920" data-height="1080">
    <div id="{{P}}-stage">
      <div id="{{P}}-col">

  <script>
    const tl = gsap.timeline({ paused: true });
    const P = "#{{P}}";
    // Enter from the right (each idea turns over like the next page), exit to the left.
    tl.fromTo(P + "-stage", { x: 160, opacity: 0, filter: "blur(8px)" }, { x: 0, opacity: 1, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 0);
    tl.fromTo(P + "-title-in", { yPercent: 105 }, { yPercent: 0, duration: 0.55, ease: "power4.out" }, 0.15);
    tl.fromTo(P + "-art", { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: "power3.out" }, 0.25);
    // The problem lands with the voice; the illustration shows it.
    tl.fromTo(P + "-r1-in", { yPercent: 102 }, { yPercent: 0, duration: 0.5, ease: "power4.out" }, {{T1}});
    // Problem pieces arrive one by one across the problem line.
    const probKids = document.querySelectorAll(P + "-q > *, " + P + "-prob > *");
    tl.fromTo(probKids, { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out", stagger: Math.min(0.9, ({{D1}} - 0.8) / probKids.length) }, {{T1}} + 0.3);
    // The fix: problem state clears, fixed state performs.
    tl.fromTo(P + "-r2-in", { yPercent: 102 }, { yPercent: 0, duration: 0.5, ease: "power4.out" }, {{T2}});
    tl.fromTo(P + "-prob", { opacity: 1, scale: 1, transformOrigin: "50% 50%" }, { opacity: 0, scale: 0.94, duration: 0.35, ease: "power2.in" }, {{T2}} + 0.2);
    const fixKids = document.querySelectorAll(P + "-fix > *");
    tl.fromTo(fixKids, { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out", stagger: Math.min(0.9, ({{D2}} - 0.6) / fixKids.length) }, {{T2}} + 0.45);
    // "Start here" is written in red pen as it is said.
    tl.fromTo(P + "-s0", { clipPath: "inset(-20px 100% -20px -10px)" }, { clipPath: "inset(-20px -10px -20px -10px)", duration: 0.45, ease: "none" }, {{T3}});
    tl.fromTo(P + "-s1", { clipPath: "inset(-20px 100% -20px -10px)" }, { clipPath: "inset(-20px -10px -20px -10px)", duration: 0.85, ease: "none" }, {{TL1}});
    tl.fromTo(P + "-s2", { clipPath: "inset(-20px 100% -20px -10px)" }, { clipPath: "inset(-20px -10px -20px -10px)", duration: 0.7, ease: "none" }, {{TL2}});
    tl.to(P + "-stage", { x: -160, opacity: 0, filter: "blur(8px)", duration: 0.35, ease: "power3.in" }, {{TOUT}});
    window.__timelines["{{ID}}"] = tl;
  </script>
