<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root {
        --ground: #0e0d0c;
        --ink: #eae2cf;
        --red: #c8372d;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--ground);
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        background: var(--ground);
      }
      #fx-vignette {
        position: absolute;
        inset: 0;
        z-index: 40;
        pointer-events: none;
        background: radial-gradient(ellipse 75% 70% at 50% 48%, transparent 55%, rgba(0, 0, 0, 0.55) 100%);
      }
      #fx-grain {
        position: absolute;
        inset: -200px;
        z-index: 41;
        pointer-events: none;
        opacity: 0.07;
        mix-blend-mode: overlay;
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' seed='7' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='300' height='300' filter='url(%23n)'/></svg>");
        background-size: 300px 300px;
      }
      .fx-bar {
        position: absolute;
        left: 0;
        width: 100%;
        height: 54px;
        background: #000;
        z-index: 60;
      }
      #fx-bar-top {
        top: 0;
      }
      #fx-bar-bottom {
        bottom: 0;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="30"
      data-width="1920"
      data-height="1080"
    >
      <div id="notebook" data-composition-id="notebook" data-composition-src="compositions/notebook.html" data-start="0" data-duration="6.1" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="city" data-composition-id="city" data-composition-src="compositions/city.html" data-start="6.1" data-duration="3.1" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="options" data-composition-id="options" data-composition-src="compositions/options.html" data-start="9.2" data-duration="2.8" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="title" data-composition-id="title" data-composition-src="compositions/title.html" data-start="12" data-duration="2.5" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="process" data-composition-id="process" data-composition-src="compositions/process.html" data-start="14.5" data-duration="8.7" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="close" data-composition-id="close" data-composition-src="compositions/close.html" data-start="23.2" data-duration="3.7" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="endcard" data-composition-id="endcard" data-composition-src="compositions/endcard.html" data-start="26.9" data-duration="3.1" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>

      <div id="captions" data-composition-id="captions" data-composition-src="compositions/captions.html" data-start="0" data-duration="30" data-track-index="2" data-track-kind="captions" data-width="1920" data-height="1080" style="z-index: 50"></div>

      <div id="fx-vignette" class="clip" data-start="0" data-duration="30" data-track-index="3"></div>
      <div id="fx-grain" class="clip" data-start="0" data-duration="30" data-track-index="3"></div>
      <div id="fx-bar-top" class="fx-bar clip" data-start="0" data-duration="30" data-track-index="3"></div>
      <div id="fx-bar-bottom" class="fx-bar clip" data-start="0" data-duration="30" data-track-index="3"></div>

      <!-- Narration: Kokoro-82M, voice am_michael, speed 0.95 (npx hyperframes tts) -->
      <audio id="vo-1" src="assets/voice/line1.wav" data-start="1" data-duration="2.39" data-track-index="10" data-volume="1.333521"></audio>
      <audio id="vo-2" src="assets/voice/line2.wav" data-start="4" data-duration="1.86" data-track-index="10" data-volume="1.566751"></audio>
      <audio id="vo-3" src="assets/voice/line3.wav" data-start="6.3" data-duration="2.37" data-track-index="10" data-volume="1.380384"></audio>
      <audio id="vo-4" src="assets/voice/line4.wav" data-start="9.4" data-duration="1.83" data-track-index="10" data-volume="1.122018"></audio>
      <audio id="vo-5" src="assets/voice/line5.wav" data-start="12.25" data-duration="1.79" data-track-index="10" data-volume="1.230269"></audio>
      <audio id="vo-6" src="assets/voice/line6.wav" data-start="14.5" data-duration="8.66" data-track-index="10" data-volume="1.244515"></audio>
      <audio id="vo-7" src="assets/voice/line7.wav" data-start="23.7" data-duration="3.22" data-track-index="10" data-volume="1.364583"></audio>
      <audio id="vo-8" src="assets/voice/line8.wav" data-start="27.6" data-duration="1.15" data-track-index="10" data-volume="1.202264"></audio>
      <!-- Original score + effects, synthesised by scripts/score.py -->
      <audio id="music" src="assets/music/score.wav" data-start="0" data-duration="30" data-volume="0.988553" data-track-index="11"></audio>
      <audio id="sfx" src="assets/sfx/sfx.wav" data-start="0" data-duration="30" data-volume="0.7" data-track-index="12"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      // Film grain: jump the noise tile 12 times a second (stepped, deterministic).
      const grainSteps = 360;
      tl.fromTo(
        "#fx-grain",
        { x: 0, y: 0 },
        {
          keyframes: Array.from({ length: grainSteps }, (_, i) => ({
            x: ((i * 137) % 200) - 100,
            y: ((i * 89) % 200) - 100,
            duration: 30 / grainSteps,
            ease: "steps(1)",
          })),
        },
        0,
      );
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
