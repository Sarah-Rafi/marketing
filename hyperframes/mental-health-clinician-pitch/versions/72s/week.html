<template>
  <style>
    #root {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background: radial-gradient(ellipse 70% 70% at 50% 45%, #1e3236 0%, #142225 70%);
      font-family: "Nunito", sans-serif;
      color: #e8eee9;
    }
    #wk-label {
      position: absolute;
      left: 0;
      top: 110px;
      width: 1920px;
      text-align: center;
      font-weight: 800;
      font-size: 40px;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: #8fb09a;
    }
    #wk-grid {
      position: absolute;
      left: 0;
      top: 0;
      width: 1920px;
      height: 1080px;
    }
    #wk-one {
      position: absolute;
      left: 0;
      top: 196px;
      width: 1920px;
      text-align: center;
      font-weight: 900;
      font-size: 64px;
      color: #f2a97e;
    }
    #wk-big {
      position: absolute;
      left: 0;
      top: 712px;
      width: 1920px;
      text-align: center;
      font-weight: 900;
      font-size: 120px;
      line-height: 1;
      text-transform: uppercase;
    }
    #wk-big span {
      display: inline-block;
    }
  </style>
  <div id="root" data-composition-id="week" data-width="1920" data-height="1080">
    <div id="wk-label">One week</div>
    <div id="wk-one">1 hour in session</div>
    <svg id="wk-grid" viewBox="0 0 1920 1080"><g id="wk-cells"></g></svg>
    <div id="wk-big"><span id="wk-b1">167 hours</span> <span id="wk-b2">on their own.</span></div>
  </div>
  <script>
    // 7 days x 24 hours = 168 cells. One of them is the session.
    const X0 = 324, Y0 = 290, S = 53, C = 45;
    const SESSION = 1 * 24 + 10; // Tuesday, 10:00
    (function () {
      let s = "";
      const days = ["M", "T", "W", "T", "F", "S", "S"];
      days.forEach((d, r) => (s += `<text x="${X0 - 26}" y="${Y0 + r * S + 33}" text-anchor="end" font-family="Nunito" font-weight="800" font-size="28" fill="rgba(232,238,233,0.6)">${d}</text>`));
      for (let k = 0; k < 168; k++) {
        const r = Math.floor(k / 24), c = k % 24;
        s += `<rect id="wk-c${k}" class="wk-c" x="${X0 + c * S}" y="${Y0 + r * S}" width="${C}" height="${C}" rx="8" fill="${k === SESSION ? "#f2a97e" : "#2c4246"}"/>`;
      }
      document.querySelector("#wk-cells").innerHTML = s;
    })();
    const tl = gsap.timeline({ paused: true });
    // v2 at 0.3: "Between appointments" (0.35–1.4), "patients are still navigating their daily challenges" (1.45–4.1).
    tl.fromTo("#wk-label", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 0.05);
    for (let r = 0; r < 7; r++) tl.fromTo(Array.from({ length: 24 }, (_, c) => "#wk-c" + (r * 24 + c)), { opacity: 0, scale: 0.4, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.3, ease: "power2.out", stagger: 0.01 }, 0.1 + r * 0.06);
    tl.fromTo("#wk-c" + SESSION, { scale: 1, transformOrigin: "50% 50%" }, { immediateRender: false, scale: 1.5, duration: 0.25, ease: "back.out(3)" }, 0.75);
    tl.to("#wk-c" + SESSION, { scale: 1, duration: 0.3, ease: "power2.out" }, 1.0);
    tl.fromTo("#wk-one", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 0.8);
    // "patients" (1.45): a wave runs through every other hour of their week.
    for (let k = 0; k < 168; k++) {
      if (k === SESSION) continue;
      const c = k % 24, r = Math.floor(k / 24);
      tl.fromTo("#wk-c" + k, { attr: { fill: "#2c4246" } }, { attr: { fill: "#55707a" }, duration: 0.18, ease: "power1.out", yoyo: true, repeat: 1 }, 1.45 + c * 0.035 + r * 0.02);
    }
    tl.fromTo("#wk-b1", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 1.55);
    tl.fromTo("#wk-b2", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 2.2);
    tl.to(["#wk-label", "#wk-one", "#wk-big"], { opacity: 0, duration: 0.3, ease: "power1.in" }, 4.45);
    window.__timelines["week"] = tl;
  </script>
</template>
