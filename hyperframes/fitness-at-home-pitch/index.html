<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root {
        --ground: #151716;
        --ink: #f2f0e9;
        --volt: #d4ff3a;
        --red: #ff4b3e;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--ground);
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        background: var(--ground);
      }
      #fx-vignette {
        position: absolute;
        inset: 0;
        z-index: 40;
        pointer-events: none;
        background: radial-gradient(ellipse 80% 75% at 50% 48%, transparent 60%, rgba(0, 0, 0, 0.4) 100%);
      }
      #fx-grain {
        position: absolute;
        inset: -200px;
        z-index: 41;
        pointer-events: none;
        opacity: 0.06;
        mix-blend-mode: overlay;
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' seed='11' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='300' height='300' filter='url(%23n)'/></svg>");
        background-size: 300px 300px;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="45" data-width="1920" data-height="1080">
      <div id="commute" data-composition-id="commute" data-composition-src="compositions/commute.html" data-start="0" data-duration="4" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="crunch" data-composition-id="crunch" data-composition-src="compositions/crunch.html" data-start="4" data-duration="3" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="physio" data-composition-id="physio" data-composition-src="compositions/physio.html" data-start="7" data-duration="5.4" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="home" data-composition-id="home" data-composition-src="compositions/home.html" data-start="12.4" data-duration="3.8" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="title" data-composition-id="title" data-composition-src="compositions/title.html" data-start="16.2" data-duration="2.8" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="roles" data-composition-id="roles" data-composition-src="compositions/roles.html" data-start="19" data-duration="5.3" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="app" data-composition-id="app" data-composition-src="compositions/app.html" data-start="24.3" data-duration="7.4" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="montage" data-composition-id="montage" data-composition-src="compositions/montage.html" data-start="31.7" data-duration="6" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="reach" data-composition-id="reach" data-composition-src="compositions/reach.html" data-start="37.7" data-duration="2.5" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="endcard" data-composition-id="endcard" data-composition-src="compositions/endcard.html" data-start="40.2" data-duration="4.8" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>

      <div id="captions" data-composition-id="captions" data-composition-src="compositions/captions.html" data-start="0" data-duration="45" data-track-index="2" data-track-kind="captions" data-width="1920" data-height="1080" style="z-index: 50"></div>

      <div id="fx-vignette" class="clip" data-start="0" data-duration="45" data-track-index="3"></div>
      <div id="fx-grain" class="clip" data-start="0" data-duration="45" data-track-index="3"></div>

      <!-- Narration: Kokoro-82M, voice af_heart, speed 1.0 (npx hyperframes tts) -->
      <audio id="vo-1" src="assets/voice/line1.wav" data-start="0.4" data-duration="3.2" data-track-index="10" data-volume="1.5"></audio>
      <audio id="vo-2" src="assets/voice/line2.wav" data-start="4" data-duration="2.41" data-track-index="10" data-volume="1.5"></audio>
      <audio id="vo-3" src="assets/voice/line3.wav" data-start="7" data-duration="5.12" data-track-index="10" data-volume="1.5"></audio>
      <audio id="vo-4" src="assets/voice/line4.wav" data-start="12.6" data-duration="3.48" data-track-index="10" data-volume="1.5"></audio>
      <audio id="vo-5" src="assets/voice/line5.wav" data-start="19.2" data-duration="4.84" data-track-index="10" data-volume="1.5"></audio>
      <audio id="vo-6" src="assets/voice/line6.wav" data-start="24.5" data-duration="7" data-track-index="10" data-volume="1.35"></audio>
      <audio id="vo-7" src="assets/voice/line7.wav" data-start="32" data-duration="5.33" data-track-index="10" data-volume="1.5"></audio>
      <audio id="vo-8" src="assets/voice/line8.wav" data-start="38" data-duration="2.07" data-track-index="10" data-volume="1.5"></audio>
      <audio id="vo-9" src="assets/voice/line9.wav" data-start="41.6" data-duration="0.94" data-track-index="10" data-volume="1.5"></audio>
      <!-- Original score + effects, synthesised by scripts/score.py -->
      <audio id="music" src="assets/music/score.wav" data-start="0" data-duration="45" data-volume="1" data-track-index="11"></audio>
      <audio id="sfx" src="assets/sfx/sfx.wav" data-start="0" data-duration="45" data-volume="0.7" data-track-index="12"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      // Film grain: jump the noise tile 12 times a second (stepped, deterministic).
      const grainSteps = 540;
      tl.fromTo(
        "#fx-grain",
        { x: 0, y: 0 },
        {
          keyframes: Array.from({ length: grainSteps }, (_, i) => ({
            x: ((i * 137) % 200) - 100,
            y: ((i * 89) % 200) - 100,
            duration: 45 / grainSteps,
            ease: "steps(1)",
          })),
        },
        0,
      );
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
