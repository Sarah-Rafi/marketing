<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root {
        --night: #142225;
        --teal: #1e3236;
        --ink: #e8eee9;
        --apricot: #f2a97e;
        --sage: #8fb09a;
        --sand: #efe4d4;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--night);
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        background: var(--night);
      }
      #fx-vignette {
        position: absolute;
        inset: 0;
        z-index: 40;
        pointer-events: none;
        background: radial-gradient(ellipse 80% 75% at 50% 48%, transparent 62%, rgba(0, 0, 0, 0.32) 100%);
      }
      #fx-grain {
        position: absolute;
        inset: -200px;
        z-index: 41;
        pointer-events: none;
        opacity: 0.05;
        mix-blend-mode: overlay;
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' seed='23' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='300' height='300' filter='url(%23n)'/></svg>");
        background-size: 300px 300px;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="62" data-width="1920" data-height="1080">
      <div id="stat" data-composition-id="stat" data-composition-src="compositions/stat.html" data-start="0" data-duration="3.6" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="office" data-composition-id="office" data-composition-src="compositions/office.html" data-start="3.6" data-duration="25" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="dawn" data-composition-id="dawn" data-composition-src="compositions/dawn.html" data-start="28.6" data-duration="3.4" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="pocket" data-composition-id="pocket" data-composition-src="compositions/pocket.html" data-start="32" data-duration="3.3" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="morning" data-composition-id="morning" data-composition-src="compositions/morning.html" data-start="35.3" data-duration="4.7" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="nightapp" data-composition-id="nightapp" data-composition-src="compositions/nightapp.html" data-start="40" data-duration="4" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="booking" data-composition-id="booking" data-composition-src="compositions/booking.html" data-start="44" data-duration="4" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="closer" data-composition-id="closer" data-composition-src="compositions/closer.html" data-start="48" data-duration="4" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="city" data-composition-id="city" data-composition-src="compositions/city.html" data-start="52" data-duration="5.3" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="endcard" data-composition-id="endcard" data-composition-src="compositions/endcard.html" data-start="57.3" data-duration="4.7" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <!-- 2 a.m. cutaway over the friends' conversation -->
      <div id="bedroom" data-composition-id="bedroom" data-composition-src="compositions/bedroom.html" data-start="12.5" data-duration="2.8" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index: 5"></div>

      <div id="captions" data-composition-id="captions" data-composition-src="compositions/captions.html" data-start="0" data-duration="62" data-track-index="3" data-track-kind="captions" data-width="1920" data-height="1080" style="z-index: 50"></div>

      <div id="fx-vignette" class="clip" data-start="0" data-duration="62" data-track-index="4"></div>
      <div id="fx-grain" class="clip" data-start="0" data-duration="62" data-track-index="4"></div>

      <!-- Dialogue: Kokoro-82M af_nova (friend A) and am_michael (friend B). Narrator: bf_emma. -->
      <audio id="vo-d1" src="assets/voice/d1.wav" data-start="3.6" data-duration="5.78" data-track-index="10" data-volume="1.5"></audio>
      <audio id="vo-d2" src="assets/voice/d2.wav" data-start="9.7" data-duration="5.29" data-track-index="10" data-volume="1.5"></audio>
      <audio id="vo-d3" src="assets/voice/d3.wav" data-start="15.3" data-duration="2.37" data-track-index="10" data-volume="1.5"></audio>
      <audio id="vo-d4" src="assets/voice/d4.wav" data-start="17.9" data-duration="7.77" data-track-index="10" data-volume="1.5"></audio>
      <audio id="vo-d5" src="assets/voice/d5.wav" data-start="25.9" data-duration="2.58" data-track-index="10" data-volume="1.5"></audio>
      <audio id="vo-n1" src="assets/voice/n1.wav" data-start="29" data-duration="1.02" data-track-index="10" data-volume="1.5"></audio>
      <audio id="vo-n2" src="assets/voice/n2.wav" data-start="32.2" data-duration="2.88" data-track-index="10" data-volume="1.5"></audio>
      <audio id="vo-n3" src="assets/voice/n3.wav" data-start="35.5" data-duration="3.86" data-track-index="10" data-volume="1.5"></audio>
      <audio id="vo-n4" src="assets/voice/n4.wav" data-start="40.2" data-duration="3.41" data-track-index="10" data-volume="1.5"></audio>
      <audio id="vo-n5" src="assets/voice/n5.wav" data-start="44.2" data-duration="3.48" data-track-index="10" data-volume="1.5"></audio>
      <audio id="vo-n6" src="assets/voice/n6.wav" data-start="48.2" data-duration="3.46" data-track-index="10" data-volume="1.5"></audio>
      <audio id="vo-n7" src="assets/voice/n7.wav" data-start="52.2" data-duration="7.19" data-track-index="10" data-volume="1.5"></audio>
      <!-- Original score + effects, synthesised by scripts/score.py -->
      <audio id="music" src="assets/music/score.wav" data-start="0" data-duration="62" data-volume="1" data-track-index="11"></audio>
      <audio id="sfx" src="assets/sfx/sfx.wav" data-start="0" data-duration="62" data-volume="0.7" data-track-index="12"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      // Film grain: jump the noise tile 12 times a second (stepped, deterministic).
      const grainSteps = 744;
      tl.fromTo(
        "#fx-grain",
        { x: 0, y: 0 },
        {
          keyframes: Array.from({ length: grainSteps }, (_, i) => ({
            x: ((i * 137) % 200) - 100,
            y: ((i * 89) % 200) - 100,
            duration: 62 / grainSteps,
            ease: "steps(1)",
          })),
        },
        0,
      );
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
